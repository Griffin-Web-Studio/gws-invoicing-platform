services:
  devcontainer:
    image: mcr.microsoft.com/devcontainers/base:bookworm
    volumes:
      - ..:/workspaces/gws-invoicing-platform:cached
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    env_file:
      - .env
    command: sleep infinity
    depends_on:
      - postgres
    userns_mode: "keep-id"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gws_books}
      POSTGRES_USER: ${POSTGRES_USER:-gws_books}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gws_books}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data:
